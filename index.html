<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find GitHub profiles and explore their repositories.">
  <title>GitHub Profile Finder</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="header-container">
      <a class="logo" href="#home" aria-label="GitHub Finder home">
        <img src="images/logo.png" alt="" width="32" height="32">
        <span>GitHub Finder</span>
      </a>

      <nav aria-label="Main navigation">
        <ul class="nav-list">
          <li><a href="#home">Home</a></li>
          <li>
            <a
              href="https://docs.github.com/en/rest/users/users"
              target="_blank"
              rel="noopener noreferrer"
            >API Docs</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="home">
    <section class="hero-section" aria-labelledby="page-title">
      <div class="content-container">
        <div class="search-section">
          <h1 id="page-title">Discover GitHub Profiles</h1>

          <form id="searchForm">
            <label class="visually-hidden" for="searchInput">
              GitHub username
            </label>
            <input
              type="search"
              id="searchInput"
              placeholder="Enter GitHub username..."
              autocomplete="off"
              required
            >
            <button type="submit" id="searchButton" class="button">
              Search
            </button>
          </form>

          <p id="errorMsg" class="message error-message" role="alert"></p>
        </div>

        <article class="profile" aria-label="GitHub profile">
          <div class="profile-avatar">
            <img
              src="images/profile.png"
              alt="GitHub profile avatar"
              id="avatar"
              width="180"
              height="180"
            >
            <a
              href="https://github.com"
              target="_blank"
              rel="noopener noreferrer"
              class="button profile-link"
              id="viewProfileBtn"
            >
              View GitHub Profile
            </a>
          </div>

          <div class="profile-details">
            <h2 id="name">Loading profile…</h2>
            <p class="username" id="username"></p>
            <p id="bio">Search for a GitHub username to get started.</p>

            <div class="profile-meta">
              <span class="meta-item" id="location"></span>
              <span class="meta-item" id="date"></span>
            </div>

            <div class="stats">
              <div class="stat-card">
                <span>Public repositories</span>
                <strong id="publicRepos">—</strong>
              </div>
              <div class="stat-card">
                <span>Followers</span>
                <strong id="followers">—</strong>
              </div>
              <div class="stat-card">
                <span>Following</span>
                <strong id="following">—</strong>
              </div>
            </div>
          </div>
        </article>
      </div>
    </section>

    <section class="repo-section" aria-labelledby="repo-heading">
      <div class="repo-inner">
        <h2 id="repo-heading">Recent repositories</h2>
        <div
          class="repo-container"
          id="reposContainer"
          aria-live="polite"
        >
          <p class="repo-message">Loading repositories…</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
